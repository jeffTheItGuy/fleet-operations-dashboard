
services:
  db:
    image: postgres:15-alpine
    container_name: cmed-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmed_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cmed_dashboard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cmed-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmed_user} -d ${POSTGRES_DB:-cmed_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cmed-backend-dev
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmed_user}:${POSTGRES_PASSWORD:-cmed_pass}@db:5432/${POSTGRES_DB:-cmed_dashboard}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - backend_venv_dev:/app/venv
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cmed-dev-network
    command: python run.py
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cmed-frontend-dev
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - cmed-dev-network
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true

volumes:
  postgres_data_dev:
    driver: local
  backend_venv_dev:
    driver: local

networks:
  cmed-dev-network:
    driver: bridge
