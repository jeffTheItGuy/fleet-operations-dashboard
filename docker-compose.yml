
services:
  db:
    image: postgres:15-alpine
    container_name: cmed-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmed_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmed_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cmed_dashboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cmed-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmed_user} -d ${POSTGRES_DB:-cmed_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cmed-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cmed_user}:${POSTGRES_PASSWORD:-cmed_pass}@db:5432/${POSTGRES_DB:-cmed_dashboard}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cmed-network
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cmed-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    depends_on:
      - backend
    networks:
      - cmed-network

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local

networks:
  cmed-network:
    driver: bridge
